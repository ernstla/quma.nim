name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_MYSQL_LOCALHOST_USER: 1
          MARIADB_MYSQL_LOCALHOST_GRANTS: USAGE
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: quma_test_db
          MARIADB_USER: quma_test_user
          MARIADB_PASSWORD: quma_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libmariadb-dev libmariadb-dev-compat
      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
      - name: Install dependencies
        run: nimble install -y
      - name: Run tests
        run: nimble test
        env:
          QUMA_TEST_BACKENDS: all
          QUMA_PGSQL_HOST: localhost
          QUMA_PGSQL_PORT: "5432"
          QUMA_PGSQL_USER: postgres
          QUMA_PGSQL_PASSWORD: postgres
          QUMA_PGSQL_DATABASE: postgres
          QUMA_MYSQL_HOST: 127.0.0.1
          QUMA_MYSQL_PORT: "3306"
          QUMA_MYSQL_USER: quma_test_user
          QUMA_MYSQL_PASSWORD: quma_test_password
          QUMA_MYSQL_DATABASE: quma_test_db
          QUMA_MYSQL_SCHEME: mariadb
